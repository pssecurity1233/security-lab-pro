---
- name: Install Security Lab Pro
  hosts: all
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
    
    - name: Install dependencies
      apt:
        name:
          - curl
          - git
          - python3
          - python3-pip
        state: present
    
    - name: Clone repository
      git:
        repo: https://github.com/yourusername/security-lab-pro.git
        dest: /opt/security-lab-pro
    
    - name: Run installer
      shell: bash /opt/security-lab-pro/scripts/install/install.sh --full
